baseURL = "https://publicmx.com"
languageCode = "en-us"
title = "Mostly Rambling"
theme = "PaperMod"
enableInlineShortcodes = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Just a bunch of rambling about almost anything."

[minify]
  minifyOutput = true

[menu]

  [[menu.main]]
    identifier = "posts"
    title = "posts"
    name = "posts"
    url = "/"
    weight = 10

[permalinks]
  posts = "/:contentbasename/"
  
[markup.goldmark.renderer]
  # Allows HTML in Markdown
  unsafe = true
